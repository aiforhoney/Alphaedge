<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AlphaEdge — AI Investment Research Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a0f;--bg2:#0d1117;--surface:#141c24;--surface2:#1a2433;
  --border:#1e2d3d;--border2:#243447;--text:#e2eaf4;--text2:#8ba3bf;--text3:#526a84;
  --accent:#00d4ff;--gold:#f0b429;--green:#00e599;--red:#ff4d6a;--purple:#a855f7;--orange:#fb923c;
  --fh:'Syne',sans-serif;--fb:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block}
.spinner{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.card:hover{border-color:var(--border2)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s;border:1px solid transparent}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.on{color:var(--accent);background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.15)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500}
.tg{background:rgba(0,229,153,.12);color:var(--green);border:1px solid rgba(0,229,153,.2)}
.tr{background:rgba(255,77,106,.12);color:var(--red);border:1px solid rgba(255,77,106,.2)}
.ty{background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.2)}
.tb{background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.2)}
.tp{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.ticker{font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.2);font-family:var(--fb)}
.btn{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:8px 16px;font-family:var(--fb);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn:hover{background:#00bbdd}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-family:var(--fb);font-size:11px;cursor:pointer;transition:all .2s}
.ghost:hover,.ghost.on{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.06)}
.chip{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;border:1px solid var(--border);color:var(--text2);background:transparent;white-space:nowrap}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(240,180,41,.08)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;color:var(--text3);font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(30,45,61,.5);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
textarea,input{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--fb);font-size:12px;padding:8px 12px;outline:none;width:100%;transition:border-color .2s;resize:none}
textarea:focus,input:focus{border-color:var(--accent)}
.sbar{background:var(--bg2);height:4px;border-radius:2px;overflow:hidden;width:50px}
.sfill{height:100%;border-radius:2px;transition:width .8s ease}
.ai-msg{animation:slideUp .3s ease}
.ai-msg p{margin-bottom:10px;line-height:1.75}
.ai-msg ul{margin:6px 0 10px 16px}
.ai-msg li{margin-bottom:5px;line-height:1.7}
.ai-msg h3{color:var(--accent);font-family:var(--fh);font-size:13px;margin:14px 0 6px}
.ai-msg h4{color:var(--gold);font-size:12px;margin:10px 0 5px;font-weight:500}
.ai-msg strong{color:var(--text);font-weight:600}
.ai-msg em{color:var(--green);font-style:italic}
.ai-msg code{background:var(--bg2);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--accent)}
</style>
</head>

const Ring=({score,size=56})=>{
  const r=(size/2)-5,circ=2*Math.PI*r,dash=(score/100)*circ;
  const col=score>=80?"var(--green)":score>=60?"var(--gold)":"var(--red)";
  return(
    <div style={{position:"relative",width:size,height:size,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
      <svg width={size} height={size} style={{position:"absolute"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth="3"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="3"
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <span style={{fontSize:size*.22,fontWeight:700,color:col,fontFamily:"var(--fh)"}}>{score}</span>
    </div>
  );
};

const Spark=({up,w=80,h=28})=>{
  const pts=[];for(let i=0;i<12;i++)pts.push(i===0?100:pts[i-1]+(Math.random()*10-(up?3:7)));
  const mn=Math.min(...pts),mx=Math.max(...pts);
  const d=pts.map((v,i)=>`${(i/11)*w},${h-((v-mn)/(mx-mn||1))*h}`).join(" ");
  return <svg width={w} height={h}><polyline points={d} fill="none" stroke={up?"var(--green)":"var(--red)"} strokeWidth="1.5" strokeLinecap="round"/></svg>;
};

const ScoreBar=({score})=>{

  return(

      <span style={{fontSize:11,fontWeight:600,color:col}}>{score}</span>
    </div>
  );
};

function Agent(){
  const [q,setQ]=useState("");
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Hello! I am your AI Investment Research Agent — combining Buffett-style fundamental analysis, Graham's margin of safety, Lynch's growth investing, and quantitative modeling.\n\nAsk me anything about Indian or global stocks.\n\n**Try:**\n- Analyze Bajaj Finance for long-term investment\n- Best hidden gems in mid-cap chemicals\n- Compare HDFC Bank vs ICICI Bank\n- Build a 10-year compounding portfolio"}]);
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[msgs]);

  const sys=`You are an elite AI Investment Research Agent for Indian and global stock markets combining Warren Buffett, Benjamin Graham, Peter Lynch, and Quantitative Analysis. For every stock analysis provide: fundamental metrics (ROE, ROCE, PE, debt, cash flows, promoter holding), valuation assessment with intrinsic value estimate, business quality and moat, risk factors, investment horizon suitability for 1M/3M/1Y/10Y, a confidence score 0-100, and BUY/HOLD/AVOID recommendation with clear reasoning. Use Rs. for Indian prices. Be specific with numbers. Always end responses with: This is AI-assisted research, not financial advice. Investments are subject to market risk.`;

  const send=async()=>{
    if(!q.trim()||loading)return;
    const um={role:"user",content:q};
    setMsgs(m=>[...m,um]);setQ("");setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:[...msgs,um].map(m=>({role:m.role,content:m.content}))})
      });
      const data=await res.json();
      const text=data.content?.map(b=>b.text||"").join("")||"Unable to generate response.";
      setMsgs(m=>[...m,{role:"assistant",content:text}]);
    }catch(e){setMsgs(m=>[...m,{role:"assistant",content:"Connection error. Please try again."}]);}
    setLoading(false);
  };

  const fmt=t=>t
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h3>$1</h3>")
    .replace(/^- (.+)$/gm,"<li>$1</li>")
    .replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/\n\n/g,"</p><p>")
    .replace(/^(?!<)/,"<p>")+"</p>";

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10,background:"var(--bg2)"}}>
        <div style={{width:30,height:30,borderRadius:7,background:"linear-gradient(135deg,var(--accent),var(--purple))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>✦</div>
        <div><div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:13}}>AI Research Agent</div><div style={{fontSize:10,color:"var(--text3)"}}>Buffett · Graham · Lynch · Quant</div></div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}><span className="dot-live"/><span style={{fontSize:10,color:"var(--green)"}}>LIVE</span></div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:18,display:"flex",flexDirection:"column",gap:14,minHeight:0}}>
        {msgs.map((m,i)=>(
          <div key={i} className="ai-msg" style={{display:"flex",gap:10,flexDirection:m.role==="user"?"row-reverse":"row"}}>
            <div style={{width:26,height:26,borderRadius:6,flexShrink:0,background:m.role==="user"?"var(--accent)":"linear-gradient(135deg,var(--accent),var(--purple))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>{m.role==="user"?"U":"AI"}</div>
            <div style={{maxWidth:"84%",background:m.role==="user"?"rgba(0,212,255,.1)":"var(--surface)",border:`1px solid ${m.role==="user"?"rgba(0,212,255,.2)":"var(--border)"}`,borderRadius:10,padding:"11px 13px",fontSize:12.5,color:"var(--text2)",fontFamily:"var(--fb)"}}
              dangerouslySetInnerHTML={{__html:fmt(m.content)}}/>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",gap:10}}>
            <div style={{width:26,height:26,borderRadius:6,background:"linear-gradient(135deg,var(--accent),var(--purple))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"white",fontWeight:700}}>AI</div>
            <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:8}}>
              <div className="spinner"/><span style={{fontSize:12,color:"var(--text3)"}}>Analyzing markets...</span>
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>
      <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)",background:"var(--bg2)"}}>
        <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
          {["Analyze HDFCBANK","Best 10Y compounders","Hidden gems mid-cap"].map(s=>(
            <button key={s} onClick={()=>setQ(s)} style={{padding:"3px 9px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,fontSize:10,color:"var(--text3)",cursor:"pointer"}}>{s}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <textarea value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}} placeholder="Ask about any stock, sector, or investment theme..." rows={2} style={{flex:1}}/>
          <button className="btn" onClick={send} disabled={loading||!q.trim()}>Send</button>
        </div>
      </div>
    </div>
  );
}

function PortfolioBuilder(){
  const universe=[
    {t:"HDFCBANK",n:"HDFC Bank",sec:"Banking",risk:"Low",cagr:14,score:91},
    {t:"INFY",n:"Infosys",sec:"IT",risk:"Low",cagr:16,score:84},
    {t:"BAJFINANCE",n:"Bajaj Finance",sec:"NBFC",risk:"Medium",cagr:22,score:88},
    {t:"TITAN",n:"Titan Company",sec:"Consumer",risk:"Medium",cagr:20,score:87},
    {t:"DEEPAKNTR",n:"Deepak Nitrite",sec:"Chemicals",risk:"Medium",cagr:18,score:79},
    {t:"PAGEIND",n:"Page Industries",sec:"Consumer",risk:"Low",cagr:17,score:85},
    {t:"CDSL",n:"CDSL",sec:"Financials",risk:"Medium",cagr:19,score:82},
    {t:"RELIANCE",n:"Reliance Inds",sec:"Conglomerate",risk:"Low",cagr:13,score:83},
    {t:"WIPRO",n:"Wipro",sec:"IT",risk:"Low",cagr:14,score:72},
    {t:"DMART",n:"Avenue Supermarts",sec:"Retail",risk:"Low",cagr:15,score:76},
  ];
  const [amount,setAmount]=useState("100000");
  const [horizon,setHorizon]=useState("5");
  const [riskPref,setRiskPref]=useState("Moderate");
  const [sip,setSip]=useState("5000");
  const [portfolio,setPortfolio]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);
  const [aiNote,setAiNote]=useState("");

  const buildPortfolio=()=>{
    const filtered=riskPref==="Conservative"
      ?universe.filter(s=>s.risk==="Low")
      :riskPref==="Aggressive"
      ?universe
      :universe.filter(s=>s.risk!=="High");
    const top=filtered.sort((a,b)=>b.score-a.score).slice(0,6);
    const weights=riskPref==="Conservative"?[30,20,18,14,10,8]:riskPref==="Aggressive"?[25,20,18,15,12,10]:[28,20,18,14,12,8];
    const inv=parseFloat(amount)||100000;
    const result=top.map((s,i)=>({
      ...s,
      weight:weights[i],
      invested:Math.round(inv*weights[i]/100),
      shares:Math.round((inv*weights[i]/100)/(parseFloat(s.t==="HDFCBANK"?1642:s.t==="INFY"?1847:s.t==="BAJFINANCE"?7218:s.t==="TITAN"?3290:s.t==="DEEPAKNTR"?2614:s.t==="PAGEIND"?44320:s.t==="CDSL"?1188:s.t==="RELIANCE"?2946:s.t==="WIPRO"?462:4780))),
    }));
    setPortfolio(result);
    setAiNote("");
  };

  const getAiThesis=async()=>{
    if(!portfolio)return;
    setAiLoading(true);
    const sys="You are an expert portfolio advisor for Indian equity markets. Given a portfolio, write a concise 3-4 sentence investment thesis covering: diversification quality, expected CAGR, key risks, and one actionable tip. Keep it sharp and data-driven.";
    const prompt=`Portfolio: ${portfolio.map(s=>`${s.n} (${s.weight}%, ${s.sec}, AI Score ${s.score})`).join(", ")}. Investment: Rs.${amount}, Horizon: ${horizon} years, Risk: ${riskPref}. Write the thesis.`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:400,system:sys,messages:[{role:"user",content:prompt}]})
      });
      const data=await res.json();
      setAiNote(data.content?.map(b=>b.text||"").join("")||"");
    }catch(e){setAiNote("Could not generate thesis. Please try again.");}
    setAiLoading(false);
  };

  const yrs=parseFloat(horizon)||5;
  const sipAmt=parseFloat(sip)||5000;
  const avgCagr=portfolio?portfolio.reduce((a,s)=>a+s.cagr*s.weight/100,0):16;
  const lumpsumFinal=portfolio?Math.round(parseFloat(amount||0)*Math.pow(1+avgCagr/100,yrs)):0;
  const sipFinal=Math.round(sipAmt*12*((Math.pow(1+avgCagr/100,yrs)-1)/(avgCagr/100)));
  const sectors=portfolio?[...new Set(portfolio.map(s=>s.sec))]:[];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* Inputs */}
      <div className="card" style={{padding:"16px 20px"}}>
        <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:14,marginBottom:14}}>⊟ Portfolio Builder — Configure Your Investment</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>
          <div>
            <div style={{fontSize:10,color:"var(--text3)",marginBottom:5}}>LUMP SUM AMOUNT (Rs.)</div>
            <input value={amount} onChange={e=>setAmount(e.target.value)} placeholder="100000"/>
          </div>
          <div>
            <div style={{fontSize:10,color:"var(--text3)",marginBottom:5}}>MONTHLY SIP (Rs.)</div>
            <input value={sip} onChange={e=>setSip(e.target.value)} placeholder="5000"/>
          </div>
          <div>
            <div style={{fontSize:10,color:"var(--text3)",marginBottom:5}}>TIME HORIZON (YEARS)</div>
            <input value={horizon} onChange={e=>setHorizon(e.target.value)} placeholder="5"/>
          </div>
          <div>
            <div style={{fontSize:10,color:"var(--text3)",marginBottom:5}}>RISK APPETITE</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:2}}>
              {["Conservative","Moderate","Aggressive"].map(r=>(
                <button key={r} className={`ghost ${riskPref===r?"on":""}`} style={{padding:"5px 10px",fontSize:10}} onClick={()=>setRiskPref(r)}>{r}</button>
              ))}
            </div>
          </div>
        </div>
        <button className="btn" onClick={buildPortfolio} style={{width:"100%",justifyContent:"center",padding:"10px"}}>
          ✦ Build AI Portfolio
        </button>
      </div>

      {portfolio&&(
        <>
          {/* Summary Cards */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
            {[
              {l:"Total Investment",v:`Rs.${parseInt(amount).toLocaleString("en-IN")}`,col:"var(--accent)"},
              {l:`Value in ${horizon}Y (Lumpsum)`,v:`Rs.${lumpsumFinal.toLocaleString("en-IN")}`,col:"var(--green)"},
              {l:`SIP Value in ${horizon}Y`,v:`Rs.${sipFinal.toLocaleString("en-IN")}`,col:"var(--gold)"},
              {l:"Expected CAGR",v:`~${avgCagr.toFixed(1)}%`,col:"var(--purple)"},
            ].map(m=>(
              <div key={m.l} className="card" style={{padding:"13px 15px"}}>
                <div style={{fontSize:9,color:"var(--text3)",marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>{m.l}</div>
                <div style={{fontSize:16,fontWeight:700,color:m.col,fontFamily:"var(--fh)"}}>{m.v}</div>
              </div>
            ))}
          </div>

          {/* Allocation Table */}
          <div className="card" style={{overflow:"hidden"}}>
            <div style={{padding:"13px 17px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:13}}>Suggested Allocation</div>

              <table>

                  <tr><th>#</th><th>Stock</th><th>Sector</th><th>Weight</th><th>Amount</th><th>Risk</th><th>Est. CAGR</th><th>AI Score</th><th>Allocation Bar</th></tr>
                </thead>
                <tbody>
                  {portfolio.map((s,i)=>(
                    <tr key={s.t}>
                      <td style={{color:"var(--text3)",fontSize:10}}>{i+1}</td>
                      <td><span className="ticker">{s.t}</span><div style={{fontSize:10,color:"var(--text2)",marginTop:2}}>{s.n}</div></td>

                      <td style={{color:"var(--green)"}}>{s.cagr}% p.a.</td>
                      <td>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <div style={{background:"var(--bg2)",height:4,borderRadius:2,width:50}}><div style={{height:"100%",borderRadius:2,width:`${s.score}%`,background:"var(--green)"}}/></div>
                          <span style={{fontSize:11,fontWeight:600,color:"var(--green)"}}>{s.score}</span>
                        </div>
                      </td>
                      <td>
                        <div style={{background:"var(--bg2)",height:8,borderRadius:4,width:80}}><div style={{height:"100%",borderRadius:4,width:`${s.weight*3}%`,background:"linear-gradient(90deg,var(--accent),var(--purple))"}}/></div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* SIP Projection */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div className="card" style={{padding:"15px 18px"}}>
              <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:13,marginBottom:12}}>SIP Growth Projection</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[1,3,5,10,15].filter(y=>y<=yrs*2).slice(0,5).map(y=>{
                  const val=Math.round(sipAmt*12*((Math.pow(1+avgCagr/100,y)-1)/(avgCagr/100)));
                  const inv=sipAmt*12*y;
                  return(
                    <div key={y} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(30,45,61,.5)"}}>
                      <span style={{fontSize:11,color:"var(--text2)"}}>Year {y}</span>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:12,fontWeight:600,color:"var(--green)"}}>Rs.{val.toLocaleString("en-IN")}</div>
                        <div style={{fontSize:9,color:"var(--text3)"}}>Invested: Rs.{inv.toLocaleString("en-IN")}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="card" style={{padding:"15px 18px"}}>
              <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:13,marginBottom:12}}>Sector Diversification</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[...new Set(portfolio.map(s=>s.sec))].map(sec=>{
                  const wt=portfolio.filter(s=>s.sec===sec).reduce((a,s)=>a+s.weight,0);
                  return(
                    <div key={sec}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:11,color:"var(--text2)"}}>{sec}</span>
                        <span style={{fontSize:11,fontWeight:600,color:"var(--accent)"}}>{wt}%</span>
                      </div>
                      <div style={{background:"var(--bg2)",height:5,borderRadius:3}}>
                        <div style={{height:"100%",borderRadius:3,width:`${wt}%`,background:"linear-gradient(90deg,var(--accent),var(--green))",transition:"width .8s"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:14,padding:"10px 12px",background:"rgba(0,229,153,.06)",borderRadius:7,border:"1px solid rgba(0,229,153,.15)"}}>
                <div style={{fontSize:10,color:"var(--text3)",marginBottom:3}}>DIVERSIFICATION SCORE</div>
                <div style={{fontSize:20,fontWeight:700,color:"var(--green)",fontFamily:"var(--fh)"}}>{Math.min(100,sectors.length*16+4)}/100</div>
                <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{sectors.length} sectors · {portfolio.length} stocks</div>
              </div>
            </div>
          </div>

          {/* AI Thesis */}
          <div className="card" style={{padding:"15px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:13}}>✦ AI Portfolio Thesis</div>
              <button className="btn" onClick={getAiThesis} disabled={aiLoading} style={{padding:"6px 14px",fontSize:11}}>
                {aiLoading?<><span className="spinner"/> Generating...</>:"Generate AI Thesis"}
              </button>
            </div>
            {aiNote
              ?<div style={{fontSize:12.5,color:"var(--text2)",lineHeight:1.8}}>{aiNote}</div>
              :<div style={{fontSize:12,color:"var(--text3)",fontStyle:"italic"}}>Click "Generate AI Thesis" to get a personalised AI analysis of this portfolio.</div>
            }
          </div>

          <div className="card" style={{padding:"12px 16px",background:"rgba(255,77,106,.04)",borderColor:"rgba(255,77,106,.15)"}}>
            <div style={{fontSize:11,color:"var(--text3)",lineHeight:1.7}}>
              <strong style={{color:"var(--text2)"}}>Disclaimer:</strong> Portfolio suggestions are AI-generated and <strong style={{color:"var(--gold)"}}>not financial advice</strong>. CAGR projections are estimates based on historical averages. Actual returns may vary. Please consult a SEBI-registered advisor.
            </div>
          </div>
        </>
      )}

      {!portfolio&&(
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:200,color:"var(--text3)",fontSize:13,flexDirection:"column",gap:8}}>
          <div style={{fontSize:28}}>⊟</div>
          <div>Enter your details above and click "Build AI Portfolio"</div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("home");
  const ALL_NAVS=[...NAVS,{id:"pb",label:"Portfolio Builder",ic:"⊟"},{id:"al",label:"Alerts",ic:"⊘"},{id:"st",label:"Settings",ic:"⚙"}];
  const cur=ALL_NAVS.find(n=>n.id===screen)||NAVS[0];
  const render=()=>{
    if(screen==="home")return <Home/>;
    if(screen==="discover")return <Discover/>;
    if(screen==="analysis")return <Analysis/>;
    if(screen==="agent")return <Agent/>;
    if(screen==="funds")return <Funds/>;
    if(screen==="news")return <NewsScreen/>;
    if(screen==="pb")return <PortfolioBuilder/>;
  };
  return(
    <div style={{display:"flex",height:"100vh",background:"var(--bg)",overflow:"hidden"}}>
      {/* Sidebar */}
      <div style={{width:210,background:"var(--bg2)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"18px 15px 14px",borderBottom:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:32,height:32,borderRadius:7,background:"linear-gradient(135deg,var(--accent),var(--purple))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>⟆</div>
            <div>
              <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:14,color:"var(--text)"}}>AlphaEdge</div>
              <div style={{fontSize:9,color:"var(--text3)",letterSpacing:".08em"}}>AI RESEARCH PLATFORM</div>
            </div>
          </div>
        </div>
        <div style={{padding:"10px 7px",flex:1,overflowY:"auto"}}>
          <div style={{fontSize:9,color:"var(--text3)",letterSpacing:".1em",padding:"4px 7px",marginBottom:3}}>MAIN MENU</div>
          {NAVS.map(n=>(
            <div key={n.id} className={`nav ${screen===n.id?"on":""}`} onClick={()=>setScreen(n.id)}>
              <span>{n.icon}</span><span>{n.label}</span>
            </div>
          ))}
          <div style={{fontSize:9,color:"var(--text3)",letterSpacing:".1em",padding:"14px 7px 4px",marginBottom:3}}>TOOLS</div>
          {[{id:"pb",label:"Portfolio Builder",ic:"⊟"},{id:"al",label:"Alerts",ic:"⊘"},{id:"st",label:"Settings",ic:"⚙"}].map(n=>(
            <div key={n.id} className={`nav ${screen===n.id?"on":""}`} onClick={()=>setScreen(n.id)}><span>{n.ic}</span><span>{n.label}</span></div>
          ))}
        </div>
        <div style={{padding:"11px 15px",borderTop:"1px solid var(--border)",background:"rgba(0,212,255,.04)"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span className="dot-live"/><span style={{fontSize:10,color:"var(--green)"}}>Markets Open</span></div>
          <div style={{fontSize:9,color:"var(--text3)"}}>NSE · BSE · 09:15 – 15:30 IST</div>
        </div>
      </div>
      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"13px 22px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:14,background:"var(--bg2)",flexShrink:0}}>
          <div>
            <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:16}}>{cur?.label||"Dashboard"}</div>
            <div style={{fontSize:10,color:"var(--text3)"}}>{screen==="agent"?"Powered by Claude AI · Buffett + Graham + Lynch":screen==="pb"?"AI-powered allocation · SIP simulation · CAGR projection":"NSE · BSE · Indian & Global Markets · Real-time Analysis"}</div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
            <div style={{fontSize:11,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:6,padding:"5px 11px",display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:9,color:"var(--text3)"}}>NIFTY 50</span>
              <span style={{fontWeight:600}}>24,362</span>
              <span style={{color:"var(--green)",fontSize:11}}>+0.78%</span>
            </div>
            <button className="btn" onClick={()=>setScreen("agent")}>✦ Ask AI</button>
          </div>
        </div>
        <div style={{flex:1,overflowY:screen==="agent"?"hidden":"auto",padding:screen==="agent"?0:"18px 22px",display:"flex",flexDirection:"column"}}>
          {screen==="agent"
            ?<div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}><Agent/></div>
            :render()
          }
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
